<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dragon Hunt AR</title>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #100000, #000);
  font-family: "Cinzel", serif;
}

.dark-top, .dark-bottom, .dark-left, .dark-right {
  position: absolute;
  background: rgba(0,0,0,0.85);
  pointer-events: none;
}

.dark-top {
  top: 0;
  left: 0;
  right: 0;
  height: 40px;
}

.dark-bottom {
  bottom: 0;
  left: 0;
  right: 0;
  height: 40px;
}

.dark-left {
  top: 40px;
  bottom: 40px;
  left: 0;
  width: 40px;
}

.dark-right {
  top: 40px;
  bottom: 40px;
  right: 0;
  width: 40px;
}
  
#hud {
  position: fixed;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#title {
  position: absolute;
  top: 55px;
  width: 100%;
  text-align: center;
  font-size: 2.8em;
  color: #ff3c00;
  text-shadow: 0 0 20px #ff0000, 0 0 40px #ff6600;
  letter-spacing: 4px;
}

#subtitle {
  position: absolute;
  top: 115px;
  width: 100%;
  text-align: center;
  color: #cc2200;
  font-size: 1em;
  opacity: 0.8;
}

#scanner {
  position: absolute;
  bottom: 60px;
  width: 100%;
  text-align: center;
  color: #ff6600;
  font-size: 1.2em;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 0.3; }
  50% { opacity: 1; }
  100% { opacity: 0.3; }
}

#frame {
  position: absolute;
  inset: 40px;
  border-radius: 22px;
  border: 2px solid rgba(255,80,0,0.6);
  box-shadow:
    0 0 40px rgba(255,60,0,0.6),
    inset 0 0 40px rgba(255,60,0,0.4);
  animation: framePulse 2s infinite ease-in-out;
  pointer-events: none;
}

@keyframes framePulse {
  0% { box-shadow: 0 0 25px rgba(255,80,0,0.4), inset 0 0 25px rgba(255,60,0,0.3); }
  50% { box-shadow: 0 0 60px rgba(255,120,0,0.8), inset 0 0 60px rgba(255,80,0,0.5); }
  100% { box-shadow: 0 0 25px rgba(255,80,0,0.4), inset 0 0 25px rgba(255,60,0,0.3); }
}

.corner {
  position: absolute;
  width: 50px;
  height: 50px;
  border: 3px solid rgba(255,120,40,0.8);
  box-shadow: 0 0 20px rgba(255,80,0,0.8);
}

.tl { top: 170px; left: 170px; border-right: none; border-bottom: none; }
.tr { top: 170px; right: 170px; border-left: none; border-bottom: none; }
.bl { bottom: 170px; left: 170px; border-right: none; border-top: none; }
.br { bottom: 170px; right: 170px; border-left: none; border-top: none; }
  
#found {
  position: absolute;
  bottom: 120px;
  width: 100%;
  text-align: center;
  font-size: 1.5em;
  color: #00ff99;
  text-shadow: 0 0 20px #00ff99;
  opacity: 0;
  transition: 0.4s;
}
</style>
</head>
<body>

<div id="hud">
  <div class="dark-top"></div>
  <div class="dark-bottom"></div>
  <div class="dark-left"></div>
  <div class="dark-right"></div>
  <div id="frame"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="title">🐉 DRAGON HUNT</div>
  <div id="subtitle">Ancient AR Summoning Ritual</div>
  <div id="scanner">📜 Scan the Dragon Sigil</div>
  <div id="found">🔥 Dragon Manifested!</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets3.mind;"
  renderer="antialias: false; precision: mediump"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-assets>
  <a-asset-item id="model" src="dragon2.glb"></a-asset-item>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0" scan-cooldown>
  <a-gltf-model
    id="dragon"
    src="#model"
    scale="0.9 0.9 0.9"
    position="0 -3 0"
    rotation="0 0 0"
    animation-mixer="clip: Flying; loop: repeat"
  ></a-gltf-model>
</a-entity>

<script>
AFRAME.registerComponent("scan-cooldown", {
  init() {
    this.lastTime = 0;
    this.cooldown = 2000;

    const model = this.el.querySelector("#dragon");
    const foundUI = document.getElementById("found");
    const scannerUI = document.getElementById("scanner");

    this.el.addEventListener("targetFound", () => {
      const now = Date.now();
      if (now - this.lastTime < this.cooldown) return;
      this.lastTime = now;

      const mixer = model.components["animation-mixer"];
      if (mixer) {
        mixer.stopAction();
        mixer.playAction("Flying");
      }

      foundUI.style.opacity = 1;
      scannerUI.innerText = "Dragon Locked";

      setTimeout(() => {
        foundUI.style.opacity = 0;
        scannerUI.innerText = "📜 Scan the Dragon Sigil";
      }, 2500);
    });
  }
});
</script>

</a-scene>

</body>
</html>
